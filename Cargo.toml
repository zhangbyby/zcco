[package]
name = "zcco"
version = "0.1.0"
edition = "2024"
description = "z-copy command output: copy piped text to the macOS clipboard"
rust-version = "1.85"
repository = "https://github.com/zhangbyby/zcco"

[dependencies]

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSPasteboard"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["NSString"] }
